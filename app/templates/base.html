<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Google Ads Automation{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/static/css/main.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="/"><i class="bi bi-google me-2"></i>Ads Automation</a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link {% if request.url.path == '/' %}active{% endif %}" href="/"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a>
        <a class="nav-link {% if '/campaigns' in request.url.path %}active{% endif %}" href="/campaigns"><i class="bi bi-megaphone me-1"></i>Campaigns</a>
        <a class="nav-link {% if '/budgets' in request.url.path %}active{% endif %}" href="/budgets"><i class="bi bi-wallet2 me-1"></i>Budgets</a>
        <a class="nav-link {% if '/rules' in request.url.path %}active{% endif %}" href="/rules"><i class="bi bi-gear me-1"></i>Rules</a>
        <a class="nav-link {% if '/reports' in request.url.path %}active{% endif %}" href="/reports/daily"><i class="bi bi-bar-chart me-1"></i>Reports</a>
        <a class="nav-link {% if '/jobs' in request.url.path %}active{% endif %}" href="/jobs"><i class="bi bi-clock-history me-1"></i>Jobs</a>
        <a class="nav-link {% if '/advanced' in request.url.path %}active{% endif %}" href="/advanced/negative-keywords"><i class="bi bi-stars me-1"></i>Advanced</a>
      </div>
    </div>
  </nav>

  <div class="container-fluid mt-4 px-4">
    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/charts.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
